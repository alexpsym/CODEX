[Tester]
; EA path is relative to MQL5\Experts (no .ex5 needed here)
Expert=PullbackEMA_ATR_RR
ExpertParameters=PullbackEMA_ATR_RR.set
; Change Symbol to anything (e.g., XAUUSD.a, GBPJPY.a, etc.)
Symbol=EURUSD.a
Period=M1
; Tick model:
; 4 = Every tick based on real ticks (most accurate, slower)
Model=4
; 0 = normal execution (no random delay)
ExecutionMode=0
; Must be 0 for visualization mode
Optimization=0
ForwardMode=0
; Set your desired range (YYYY.MM.DD)
FromDate=2025.05.01
ToDate=2025.05.31
Deposit=2500
Currency=AUD
Leverage=30:1
; Visual mode ON
Visual=1
; Optional report output
Report=reports\PullbackEMA_ATR_RR_EURUSD_M1.htm
ReplaceReport=1
; Agents: local only (visual testing requires a local agent)
UseLocal=1
UseRemote=0
UseCloud=0
ShutdownTerminal=0
